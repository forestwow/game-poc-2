name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # The two machines the pinned state hashes must agree on (plan decision 9): Linux x64 and macOS ARM.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # `dotnet test` alone compiles only the test project and what it references, never the game.
      - run: dotnet build Understudies.sln --configuration Release
      - run: dotnet test Understudies.sln --configuration Release --no-build
